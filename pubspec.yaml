name: seoulfit_ui
description: "SeoulFit — AI-powered Seoul travel companion (UI-only build)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^15.1.2
  provider: ^6.1.2
  google_fonts: ^6.2.1

  # Backend layer (copied from webapp/seoulfit_flutter_app).
  http: ^1.2.0
  http_parser: ^4.1.2
  shared_preferences: ^2.3.0

  # Real map on Final Route + location for live help.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.0

  # Seoul Lens capture + Kakao map deep links.
  image_picker: ^1.1.0
  url_launcher: ^6.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/data/

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
