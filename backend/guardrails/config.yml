# NeMo Guardrails — INPUT gatekeeper only (step 1).
#
# We do NOT use NeMo to generate replies (LangGraph already does that). Only the
# input rail runs: it makes ONE extra Gemini call per user message to decide if
# the message is off-topic / a prompt-injection / a jailbreak, then blocks it.
#
# engine: google_genai runs through langchain-google-genai (already a dep — rag.py
# uses it for embeddings), which builds a ChatGoogleGenerativeAI reading
# GOOGLE_API_KEY. Requires NEMOGUARDRAILS_LLM_FRAMEWORK=langchain, which
# guardrail_gate.py sets before importing nemoguardrails.
models:
  - type: main
    engine: google_genai
    model: gemini-2.5-flash

rails:
  input:
    flows:
      - self check input
